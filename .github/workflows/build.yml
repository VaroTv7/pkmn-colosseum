name: Source checks

# Public, source-only CI. It has no original game files, original-derived
# objects or proprietary compilers, so it cannot and does not claim a retail
# build. Full binary and source-regression validation runs locally with
# tools/local_retail/validate.py and is published separately as the
# local-retail/* commit statuses (docs/github_actions.md).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: source-only checks (no retail inputs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checker and local-validation tests (synthetic fixtures)
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Canonical manifest is unchanged and complete
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from tools.ci_retail import read_manifest
          from tools.local_retail.validate import CANONICAL_DOL_SHA1
          version, entries = read_manifest("config/GC6E01/build.sha1")
          digests = {relative: digest for relative, _, digest in entries}
          assert digests["sys/main.dol"] == CANONICAL_DOL_SHA1, "canonical DOL hash changed"
          print(f"{version}: {len(entries)} canonical outputs, DOL {CANONICAL_DOL_SHA1}")
          PY

      - name: Fail on any live .inc asm wrapper
        run: python3 .github/scripts/check_asm_wrappers.py src

      - name: Project configuration generates without originals
        run: python3 configure.py --version GC6E01
