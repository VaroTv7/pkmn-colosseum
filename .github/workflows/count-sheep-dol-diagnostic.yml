name: DOL-only integration diagnostics

# Diagnostic only: this cannot substitute for the canonical DOL + 25 REL build.
# The temporary profile and reports never enter the repository or progress chart.
on:
  push:
    branches: [integrate/count-sheep-full-20261011]
    paths: [.github/workflows/count-sheep-dol-diagnostic.yml]

permissions:
  contents: read
  packages: read

jobs:
  diagnostic:
    name: DOL-only (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ghcr.io/dougchansan/pkmn-colosseum-build:main
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: upstream
            revision: 5cfe5ca3d09f20c4adc3c9b2a4e8d3c29046f10f
          - label: donor
            revision: 741453444805acb817e4d9409416ac9c3de5b20e
          - label: reconciled
            revision: 5c2de957e880bc86d8ba54db55dc928c49cbc4bd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare a disposable DOL-only profile
        shell: sh
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cp -a /orig .
          mkdir -p /tmp/dol-diagnostic
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          root = Path('config/GC6E01')
          config = root / 'config.yml'
          text = config.read_text()
          profile = root / 'config.dol-diagnostic.yml'
          profile.write_text(text.split('\nmodules:', 1)[0]+'\n')
          canonical = root / 'build.sha1'
          dol_lines = [line for line in canonical.read_text().splitlines() if line.rstrip().endswith('/main.dol')]
          assert len(dol_lines) == 1
          (root / 'build.dol-diagnostic.sha1').write_text(dol_lines[0]+'\n')
          p = Path('configure.py')
          source = p.read_text()
          marker = 'if args.mode == "configure":'
          assert source.count(marker) == 1
          override = '''# Disposable CI diagnostic: not the canonical project profile.
          excluded = set(getattr(config, "gnu_ld_modules", []))
          config.libs = [lib for lib in config.libs if lib["lib"] not in excluded]
          config.gnu_ld_modules = []
          config.custom_build_steps = {}
          config.config_path = Path("config/GC6E01/config.dol-diagnostic.yml")
          config.check_sha_path = Path("config/GC6E01/build.dol-diagnostic.sha1")
          '''
          p.write_text(source.replace(marker, override+'\n'+marker))
          metadata = {'scope':'DOL-only diagnostic; RELs excluded and NOT validated',
                      'revision':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                      'canonical_dol_check':dol_lines[0],
                      'canonical_config_sha256':hashlib.sha256(config.read_bytes()).hexdigest(),
                      'canonical_hash_file_sha256':hashlib.sha256(canonical.read_bytes()).hexdigest()}
          Path('/tmp/dol-diagnostic/scope.json').write_text(json.dumps(metadata,indent=2)+'\n')
          print(json.dumps(metadata,indent=2))
          PY
          git diff --exit-code -- src include config/GC6E01/config.yml config/GC6E01/build.sha1 config/GC6E01/splits.txt
      - name: Compile all DOL sources and regenerate the DOL report
        id: source
        shell: sh
        run: |
          set -eu
          python configure.py --map --version GC6E01 --binutils /binutils --compilers /compilers
          if ! ninja -j2 all_source build/GC6E01/report.json > /tmp/dol-source.log 2>&1; then
            tail -100 /tmp/dol-source.log
            exit 1
          fi
          cp build/GC6E01/report.json /tmp/dol-diagnostic/report.json
          tail -8 /tmp/dol-source.log
      - name: Link and check the canonical DOL hash only
        id: link
        shell: sh
        run: |
          set -eu
          if ! ninja -j2 > /tmp/dol-link.log 2>&1; then
            tail -100 /tmp/dol-link.log
            exit 1
          fi
          tail -12 /tmp/dol-link.log
          sha1sum -c config/GC6E01/build.dol-diagnostic.sha1
          python .github/scripts/check_metric_integrity.py build/GC6E01/report.json orig/GC6E01/sys/main.dol
      - name: Record the limited validation scope
        if: always()
        shell: sh
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          LINK_OUTCOME: ${{ steps.link.outcome }}
          LABEL: ${{ matrix.label }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          path=Path('/tmp/dol-diagnostic/scope.json')
          if not path.exists():
              path.parent.mkdir(parents=True,exist_ok=True)
              result={'scope':'DOL-only diagnostic; preparation failed'}
          else:
              result=json.loads(path.read_text())
          result.update(label=os.environ['LABEL'], source_outcome=os.environ['SOURCE_OUTCOME'], link_outcome=os.environ['LINK_OUTCOME'], full_retail_validation=False)
          report=Path('/tmp/dol-diagnostic/report.json')
          if report.exists():
              result['measures']=json.loads(report.read_text())['measures']
          path.write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dol-only-${{ matrix.label }}
          path: /tmp/dol-diagnostic/
          retention-days: 7
