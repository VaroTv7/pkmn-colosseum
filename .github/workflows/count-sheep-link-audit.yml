name: Count-Sheep link audit
on:
  push:
    branches: [integrate/count-sheep-full-20261011]
    paths: [.github/workflows/count-sheep-link-audit.yml]
permissions:
  contents: read
  packages: read
jobs:
  link-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container: ghcr.io/dougchansan/pkmn-colosseum-build:main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 596e8e7779fe688c2249fdc0d61e0d40962cdcc4
          persist-credentials: false
      - name: Prepare disposable DOL-only profile
        shell: sh
        run: |
          set -eu
          cp -a /orig .
          mkdir -p /tmp/link-audit
          python - <<'PY'
          from pathlib import Path
          root=Path('config/GC6E01')
          (root/'config.dol-diagnostic.yml').write_text((root/'config.yml').read_text().split('\nmodules:',1)[0]+'\n')
          lines=[s for s in (root/'build.sha1').read_text().splitlines() if s.rstrip().endswith('/main.dol')]
          assert len(lines)==1
          (root/'build.dol-diagnostic.sha1').write_text(lines[0]+'\n')
          override='''# Temporary diagnostic; original REL validation remains required.
          excluded=set(config.gnu_ld_modules)
          config.libs=[lib for lib in config.libs if lib["lib"] not in excluded]
          config.gnu_ld_modules=[]
          config.custom_build_steps={}
          config.config_path=Path("config/GC6E01/config.dol-diagnostic.yml")
          config.check_sha_path=Path("config/GC6E01/build.dol-diagnostic.sha1")
          '''
          p=Path('configure.py');s=p.read_text();p.write_text(s.replace('if args.mode == "configure":',override+'\nif args.mode == "configure":'))
          PY
          python configure.py --map --version GC6E01 --binutils /binutils --compilers /compilers
          if ! ninja -j2 all_source build/GC6E01/report.json >/tmp/source.log 2>&1; then tail -100 /tmp/source.log; exit 1; fi
          ninja -j2 build/GC6E01/main.dol >/tmp/baseline-link.log 2>&1
      - name: Compare targeted retail symbol retention with identical source objects
        shell: sh
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re,shlex,shutil,struct,subprocess as sp
          from tools.patch_forceactive_ldscript import patch_forceactive_block
          out=Path('/tmp/link-audit')
          original=Path('orig/GC6E01/sys/main.dol').read_bytes()
          expected=hashlib.sha1(original).hexdigest()
          lcf=Path('build/GC6E01.main.forceactive.lcf')
          pristine=lcf.read_text()
          objects=shlex.split(Path('build/GC6E01/main.elf.rsp').read_text())
          assert objects and all(Path(obj).suffix=='.o' and Path(obj).is_file() for obj in objects)
          defined=set()
          for i in range(0,len(objects),100):
              text=sp.check_output(['/binutils/powerpc-eabi-nm','-j','--defined-only',*objects[i:i+100]],text=True)
              defined.update(line.strip() for line in text.splitlines() if line.strip() and not line.endswith(':'))
          canonical=dict(re.findall(r'^(\S+) = ([^:]+):0x[0-9a-fA-F]+;',Path('config/GC6E01/symbols.txt').read_text(),re.M))
          roots={
              'baseline':[],
              'retail-text':[n for n,section in canonical.items() if section in {'.text','.init'} and n in defined],
              'retail-all':[n for n in canonical if n in defined],
          }
          results=[]
          for label,names in roots.items():
              if names:lcf.write_text(patch_forceactive_block(pristine,names))
              with open(f'/tmp/{label}-link.log','w') as log:
                  rc=sp.run(['ninja','-j2','build/GC6E01/main.dol'],stdout=log,stderr=sp.STDOUT).returncode
              log=Path(f'/tmp/{label}-link.log').read_text(errors='replace')
              errors='\n'.join(line for line in log.splitlines() if re.search('error|Error|FAILED|failed|undefined|Undefined|unresolved',line))
              (out/f'{label}-errors.txt').write_text(errors+'\n')
              result={'label':label,'link_exit_code':rc,'expected_sha1':expected,'retained_canonical_symbols':len(names),'scope':'DOL-only; RELs not validated'}
              p=Path('build/GC6E01/main.dol')
              if rc==0 and p.exists():
                  b=p.read_bytes()
                  result.update(rebuilt_sha1=hashlib.sha1(b).hexdigest(),size=len(b),byte_identical=(b==original),text_sizes=list(struct.unpack_from('>7I',b,0x90)))
                  sections=[]
                  for i in range(18):
                      ao=struct.unpack_from('>I',original,4*i)[0];bo=struct.unpack_from('>I',b,4*i)[0]
                      size=struct.unpack_from('>I',original,0x90+4*i)[0];bs=struct.unpack_from('>I',b,0x90+4*i)[0]
                      if size:sections.append({'index':i,'size':size,'rebuilt_size':bs,'different_bytes':sum(x!=y for x,y in zip(original[ao:ao+size],b[bo:bo+bs]))})
                  result['sections']=sections
              shutil.copyfile('build/GC6E01/main.elf.MAP',out/f'{label}-main.elf.MAP')
              with open(out/f'{label}-symbols.txt','w') as f:sp.run(['/binutils/powerpc-eabi-nm','-S','-n','build/GC6E01/main.elf'],stdout=f,stderr=sp.DEVNULL)
              (out/f'{label}-roots.json').write_text(json.dumps(names,indent=2)+'\n')
              results.append(result);print(json.dumps(result,indent=2));print(errors[-2000:])
          (out/'results.json').write_text(json.dumps(results,indent=2)+'\n')
          shutil.copyfile('build/GC6E01/report.json',out/'report.json')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: count-sheep-link-audit
          path: /tmp/link-audit/
          retention-days: 7
