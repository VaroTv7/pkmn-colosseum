name: Finalize verified Count-Sheep metadata
on:
  push:
    branches: [integrate/count-sheep-full-20261011]
    paths: [.github/workflows/count-sheep-metadata-finalize.yml]
permissions:
  contents: write
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply only the exact audited metadata changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --exit-code a6ad511bb49b877e502ed2c406452e9ce524918e HEAD -- src include configure.py config/GC6E01/config.yml config/GC6E01/build.sha1 config/GC6E01/splits.txt config/GC6E01/symbols.txt tools/project.py
          test "$(git rev-parse HEAD:config/GC6E01/object_map.freeze.json)" = a3a8db042c9faf3fd5c5dbc95e3f4d3a46a7df1b
          test "$(git rev-parse HEAD:tools/update_readme_progress.py)" = f5508deaeca33ae3622376568a0b9434eeb49f4a
          test "$(git rev-parse HEAD:README.md)" = 27fb50076cc8ea99302ea0e066d76e8360242af1
          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import json
          from tools.update_readme_progress import progress_table,update_readme
          p=Path('config/GC6E01/object_map.freeze.json');freeze=json.loads(p.read_text())
          removed=set('''main/game/data/data_8036DD90
          main/game/gs_candidate_801C8834
          main/game/gs_candidate_801C89F8
          main/game/fight_range_802249B8
          main/game/fight_range_exact_80226134
          main/game/fight_range_802274F0
          main/game/fight_range_exact_802279F8
          main/game/fight_range_80227DB8
          main/game/fight_range_exact_8022808C
          main/game/fight_range_802282D8
          main/game/fight_range_exact_80228DAC
          main/game/fight_range_80229704
          main/game/fight_range_exact_80229B70
          main/game/fight_range_80229C28
          main/game/fight_range_8022A504
          main/game/fight_range_exact_8022B29C
          main/game/fight_range_8022B2CC'''.splitlines())
          added=[
            {'name':'main/game/gs_exact_801C8834','sections':[{'name':'.data','size':220,'virtual_address':2151079312},{'name':'.text','size':1436,'virtual_address':2149353524}],'total_code':1436,'total_data':220,'total_functions':2},
            {'name':'main/game/fight_range_802249B8_to_8022BB84','sections':[{'name':'.data','size':360,'virtual_address':2151260704},{'name':'.text','size':29132,'virtual_address':2149730744}],'total_code':29132,'total_data':360,'total_functions':39},
          ]
          before=[u for u in freeze['unit_topology'] if u['name'] in removed]
          assert len(before)==len(removed)==17
          def intervals(units):
              grouped=defaultdict(list)
              for u in units:
                  for s in u['sections']:
                      start=s['virtual_address'];assert start is not None
                      grouped[(u['name'].split('/')[0],s['name'])].append((start,start+s['size']))
              result={}
              for key,ranges in grouped.items():
                  merged=[]
                  for start,end in sorted(ranges):
                      if merged and start==merged[-1][1]:merged[-1]=(merged[-1][0],end)
                      else:
                          assert not merged or start>=merged[-1][1]
                          merged.append((start,end))
                  result[key]=merged
              return result
          assert intervals(before)==intervals(added)
          for key in ('total_code','total_data','total_functions'):
              assert sum(u[key] for u in before)==sum(u[key] for u in added)
          assert freeze['invariants']=={'total_code':2504940,'total_data':3566037,'total_functions':8677,'total_units':2178}
          insert={'main/game/data/data_8036DD90':added[0],'main/game/fight_range_802249B8':added[1]}
          units=[]
          for u in freeze['unit_topology']:
              if u['name'] in insert:units.append(insert[u['name']])
              elif u['name'] not in removed:units.append(u)
          assert len(units)==2163
          freeze['unit_topology']=units
          freeze['invariants']['total_units']=2163
          freeze['topology_status'].update(named_units=2066,source_backed_units=2065)
          freeze['baseline_progress']={'matched_code':'2299812','matched_code_percent':91.81106,'matched_data':'2098410','matched_data_percent':58.844315,'matched_functions':8535,'matched_functions_percent':98.36349,'fuzzy_match_percent':99.68803}
          p.write_text(json.dumps(freeze,indent=2)+'\n')
          p=Path('tools/update_readme_progress.py');s=p.read_text()
          assert s.count('| Linked into DOL | ')==1
          p.write_text(s.replace('| Linked into DOL | ','| Source-linked | '))
          measures={'fuzzy_match_percent':99.68803,'total_code':'2504940','matched_code':'2299812','matched_code_percent':91.81106,'total_data':'3566037','matched_data':'2098410','matched_data_percent':58.844315,'total_functions':8677,'matched_functions':8535,'matched_functions_percent':98.36349,'complete_code':'2266408','complete_code_percent':90.47754,'complete_data':'1078914','complete_data_percent':30.255266,'total_units':2163,'complete_units':1891}
          p=Path('README.md');s=update_readme(p.read_text(),progress_table({'measures':measures}).replace('| Linked into DOL | ','| Source-linked | '))
          start=s.index('These numbers come from the canonical dtk/objdiff report generated at')
          end=s.index('After rebuilding the report, refresh the table with:',start)
          s=s[:start]+'''These measurements cover the **DOL and all 25 configured REL modules**, from the
          full `build/GC6E01/report.json` generated on 2026-10-12. All 26 rebuilt binaries
          passed their unchanged canonical hashes and direct byte comparisons. This is a
          matching reconstruction with original fallback objects where required, not a
          claim of 100% decompilation or gameplay testing. See
          [`docs/COUNT_SHEEP_INTEGRATION.md`](docs/COUNT_SHEEP_INTEGRATION.md) for validation
          scope, provenance, and the separate CI input-provisioning limitation.

          The DOL alone is 91.78% code-matched and 94.95% data-matched. The combined data
          percentage also includes the large, mostly unreconstructed `common_rel` data
          region, so it is not comparable to an older DOL-only data percentage.

          **Scoring units are not translation units.** An original source region may be
          split into address-owned units with different compiler flags, compiled through
          one-line `#include` shims. The full report contains 8,677 distinct module/address
          function identities, with no duplicate claims. Its 2,504,940-byte code denominator
          contains 2,495,112 DOL bytes and 9,828 REL bytes; source-linked coverage is measured
          across those same outputs. The freeze tracks their exact section topology.

          '''+s[end:]
          old='''The build splits `sys/main.dol`, substitutes only objects declared in
          `configure.py`, links `build/GC6E01/main.dol`, and verifies it against
          `config/GC6E01/build.sha1`.'''
          new='''The build splits `sys/main.dol` and the 25 configured original REL modules,
          substitutes only objects declared in `configure.py`, and verifies all 26 rebuilt
          outputs against `config/GC6E01/build.sha1`. Original RELs belong under
          `orig/GC6E01/files/`; complete loose modules or their FSYS archives are supported.'''
          assert old in s;p.write_text(s.replace(old,new))
          Path('/tmp/measured-progress.json').write_text(json.dumps({'measures':measures}))
          print('Conserved all affected section intervals: 17 previous units -> 2 merged units, no code/data/function denominator loss.')
          PY
          test "$(git hash-object config/GC6E01/object_map.freeze.json)" = 504bc98aa8197e93eff02ade313c74d02bab0496
          test "$(git hash-object tools/update_readme_progress.py)" = bf01c44593fe0270637593dcf4b09b3ada4d747d
          test "$(git hash-object README.md)" = db130a435a6bfbb4c580b2a34f5a1ed9e733eee6
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 tools/update_readme_progress.py --report /tmp/measured-progress.json --check
          git diff --check
          git add config/GC6E01/object_map.freeze.json tools/update_readme_progress.py README.md
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'Refresh verified full DOL and REL progress and conserved object topology' -m 'Full 26-output hash/direct-byte validation passed for a6ad511b. Record 91.81106% matched code and 8535/8677 exact functions. Audited 17-to-2 unit consolidations conserve every section interval, code byte, data byte and function; only total units changes 2178 to 2163. No game source, original hash, compiler flags or split ownership changed. Ordinary CI input provisioning is still separate from this metadata-only job.'
          git push origin HEAD:refs/heads/integrate/count-sheep-full-20261011
          git log -1 --format='Metadata commit: %H%nTree: %T'
