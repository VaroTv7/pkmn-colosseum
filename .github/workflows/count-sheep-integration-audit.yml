name: Count-Sheep integration audit

on:
  push:
    branches: [integrate/count-sheep-full-20261011]
    paths: [.github/workflows/count-sheep-integration-audit.yml]

permissions:
  contents: write
  packages: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ghcr.io/dougchansan/pkmn-colosseum-build:main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge the pinned upstream history into the import
        shell: sh
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git rev-parse origin/master)" = 5cfe5ca3d09f20c4adc3c9b2a4e8d3c29046f10f
          git merge-base --is-ancestor a57d34f2dd688d669bd5cfe12a4085ef1cbed857 HEAD
          set +e
          git merge --no-commit --no-ff 5cfe5ca3d09f20c4adc3c9b2a4e8d3c29046f10f
          rc=$?
          set -e
          test "$rc" -eq 1
      - name: Apply source resolutions verified in the offline Git audit
        shell: sh
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess as sp
          DONOR = 'a57d34f2dd688d669bd5cfe12a4085ef1cbed857'
          UPSTREAM = '5cfe5ca3d09f20c4adc3c9b2a4e8d3c29046f10f'
          def git(*args):
              return sp.check_output(['git', *args], text=True)
          def check(*args):
              sp.run(['git', *args], check=True)
          mapping_text = git('show', f'{UPSTREAM}:config/GC6E01/symbolmap/runtime_evidence_names.txt')
          names = dict(re.findall(r'^(\w+) -> (\w+)', mapping_text, re.M))
          assert len(names) == 42 and len(set(names.values())) == 42
          semantic_conflicts = {
              'configure.py', 'src/dolphin/sdk_range_80098108.c',
              'src/hsd/hsd_jobj_exact_801A1980.c',
              'src/game/fight_trainer_ai_waza_value_candidate_80245FC4.c',
          }
          rename_files = set(git('diff', '--name-only', '171d763ad^', '171d763ad').splitlines())
          conflicts = git('diff', '--name-only', '--diff-filter=U').splitlines()
          assert len(conflicts) == 39, conflicts
          assert set(conflicts) <= semantic_conflicts | rename_files
          for path in conflicts:
              present = sp.run(['git', 'cat-file', '-e', f'{DONOR}:{path}'], capture_output=True).returncode == 0
              if present:
                  check('checkout', '--ours', '--', path)
                  check('add', '--', path)
              else:
                  check('rm', '--', path)
          tokens = re.compile(r'//[^\n]*|/\*.*?\*/|"(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\'|[A-Za-z_]\w*', re.S)
          changed = []
          for name in git('ls-files', 'src', 'include').splitlines():
              p = Path(name)
              if p.suffix not in {'.c', '.h', '.cpp', '.hpp'} or not p.is_file():
                  continue
              text = p.read_text()
              out = tokens.sub(lambda m: names.get(m[0], m[0]), text)
              if out != text:
                  p.write_text(out)
                  changed.append(name)
          symbols_path = Path('config/GC6E01/symbols.txt')
          symbols = symbols_path.read_text()
          for old, new in names.items():
              addr = old[3:]
              symbols = re.sub(r'^'+re.escape(old)+r'(?= = \.text:0x'+addr+r';)', new, symbols, flags=re.M)
              assert len(re.findall(r'^'+new+r' = \.text:0x'+addr+r';', symbols, re.M)) == 1, (old, new)
              assert not re.search(r'^'+old+r' =', symbols, re.M), old
          symbols_path.write_text(symbols)
          cfg = Path('configure.py')
          t = cfg.read_text()
          for old, new in names.items():
              t = t.replace(chr(34)+old+chr(34), chr(34)+new+chr(34))
              t = t.replace(chr(39)+old+chr(39), chr(39)+new+chr(39))
          cfg.write_text(t)
          check('add', '--', str(cfg))
          ost = Path('src/dolphin/os/OSThread.c')
          t = ost.read_text()
          assert t.count('    RunQueueHint = 0;') == 1
          ost.write_text(t.replace('    RunQueueHint = 0;', '    RunQueueHint_8047A764 = 0;'))
          check('add', '--', str(ost))
          for f in ['src/game/fight_trainer_ai_waza_value_exact_80247048.c', 'src/game/fight_trainer_ai_waza_value_exact_8024A664.c']:
              assert Path(f).read_text() == git('show', f'{UPSTREAM}:{f}'), f
          assert 'return (f32*)cobj->view_mtx;' in Path('include/hsd/hsd_cobj.h').read_text()
          assert 'u32 rest = rmode->xfbHeight - n_xfb_lines;' in Path('src/hsd/video.c').read_text()
          assert '*p++ = 0x10801080;' in Path('src/hsd/video.c').read_text()
          assert 'static volatile int RunQueueHint_8047A764;' in Path('src/dolphin/os/OSThread.c').read_text()
          assert Path('src/dolphin/sdk_range_80098108.c').read_text().count('const char* __OSVersion =') == 1
          check('add', '--', *changed, 'config/GC6E01/symbols.txt')
          assert not git('diff', '--name-only', '--diff-filter=U').strip()
          assert not any(p.endswith('.inc') for p in git('diff', '--cached', '--name-only', DONOR).splitlines())
          assert not git('diff', '--cached', DONOR, '--', 'config/GC6E01/build.sha1', 'config/GC6E01/config.yml', 'config/GC6E01/splits.txt').strip()
          print(f'Resolved {len(conflicts)} conflicts; propagated 42 canonical runtime names across {len(changed)} additional source/header files.')
          PY
      - name: Remove dormant wrappers and register the evidenced SDK reset body
        shell: sh
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          files = {'src/game/fsys/fsys_file_candidates.c':29, 'src/game/gs_material_range_800DF028.c':24, 'src/game/gs_thread.c':67, 'src/game/menuNameEntry.c':23}
          opening = re.compile(r'^#if[ \t]+0[ \t]*\nasm\b[^{}]*\{\s*\n#include[ \t]+"[^"\n]+\.inc"[ \t]*\n\}[ \t]*\n#else[^\n]*\n', re.M)
          directive = re.compile(r'^\s*#\s*(if|ifdef|ifndef|endif)\b', re.M)
          for name, expected in files.items():
              p = Path(name)
              s = p.read_text()
              count = 0
              while (m := opening.search(s)):
                  depth = 1
                  closing = None
                  for d in directive.finditer(s, m.end()):
                      depth += -1 if d[1] == 'endif' else 1
                      if depth == 0:
                          e = s.find('\n', d.end())
                          closing = (d.start(), e+1 if e >= 0 else len(s))
                          break
                  assert closing, (name, m.start())
                  s = s[:m.start()] + s[m.end():closing[0]] + s[closing[1]:]
                  count += 1
              assert count == expected, (name, count)
              p.write_text(s)
              print(name, count, 'dormant wrapper blocks removed')
          p = Path('src/dolphin/os/OSReset_exact.c')
          s = p.read_text()
          s = s.replace('asm void Reset_', '/* Authentic Dolphin SDK reset assembly; see docs/asm_evidence/os_reset.md. */\nasm void Reset_', 1)
          p.write_text(s)
          p = Path('docs/asm_evidence/registry.json')
          r = json.loads(p.read_text())
          assert not any(e['function'] == 'Reset_8009FF50' for e in r['entries'])
          r['entries'].append({'path':'src/dolphin/os/OSReset_exact.c','function':'Reset_8009FF50','mnemonics':['b','blt','cmplwi','isync','li','lis','mfspr','mftb','mtspr','nop','ori','stw','subf','sync'],'evidence':'docs/asm_evidence/os_reset.md'})
          p.write_text(json.dumps(r, indent=2)+'\n')
          Path('docs/asm_evidence/os_reset.md').write_text('''# Dolphin SDK reset assembly

          ## Reset_8009FF50

          - Origin: Nintendo Dolphin SDK OSReset.c, the hardware-reset primitive at
            Colosseum GC6E01 address 0x8009FF50. The imported implementation comes from
            donor commit f559f0cc143ffb11b87eeb48f903d5fac51d644a.
          - Why it cannot be C: this is the SDK's frameless hardware-reset sequence,
            using HID0 special-register access, isync/sync and raw time-base reads, then
            writing the reset registers and looping without a normal return. Ordinary
            portable C does not express those processor operations or the frameless
            entry convention. This identifies the assembly contract, not a proof that
            every compiler-specific C extension has been exhausted.
          - Other decompilations: zeldaret/tww retains the same Reset body as an ASM
            function, including the HID0 update, time-base delay threshold 0x1124,
            reset-register stores, and branch structure:
            https://github.com/zeldaret/tww/blob/f5234ec8f4b8f4119b8db4a018c1ca25572988b1/src/dolphin/os/OSReset.c
          - External branch targets: none; every branch is local to the function.

          The registry entry is restricted to this source path, function, and exact
          mnemonic set. It does not expand the generic hardware-primitives allowlist.
          No instruction was changed by registration. Quality tests exercise the full
          body, reject an added call, and reject reusing this permission in game code.
          Fresh retail-byte validation remains a separate requirement; the historical
          source comparison alone is not a new matching measurement.
          ''')
          Path('.github/scripts/test_os_reset_evidence.py').write_text('''"""Keep the reset-assembly exception scoped to its evidenced SDK body."""
          import unittest
          from pathlib import Path
          import quality_scan

          PATH = 'src/dolphin/os/OSReset_exact.c'
          FUNCTION = 'Reset_8009FF50'

          class ResetEvidenceTests(unittest.TestCase):
              def setUp(self):
                  source = (quality_scan.REPO_ROOT / PATH).read_text()
                  regions = quality_scan.find_asm_regions(source)
                  self.body = next(r['body'] for r in regions if r['func'] == FUNCTION)

              def test_registry_evidence_complete(self):
                  entry = quality_scan.AUTHENTIC_ASM[(PATH, FUNCTION)]
                  self.assertEqual(quality_scan.evidence_problems(entry), [])

              def test_original_body_allowed(self):
                  self.assertTrue(quality_scan.asm_body_ok(self.body, PATH, FUNCTION))

              def test_extra_function_call_rejected(self):
                  self.assertFalse(quality_scan.asm_body_ok(self.body+'\\n bl arbitrary_function', PATH, FUNCTION))

              def test_game_path_cannot_reuse_exception(self):
                  self.assertFalse(quality_scan.asm_body_ok(self.body, 'src/game/reset.c', FUNCTION))

          if __name__ == '__main__':
              unittest.main()
          ''')
          PY
      - name: Require the exact audited tree and commit the reconciliation
        shell: sh
        run: |
          set -eu
          git add src include config configure.py docs/asm_evidence .github/scripts/test_os_reset_evidence.py
          git rm .github/workflows/count-sheep-integration-audit.yml
          git diff --cached --check
          ACTUAL="$(git write-tree)"
          echo "Audited tree: $ACTUAL"
          test "$ACTUAL" = 9812e5d04e0b277c8ed0908a94e1f9207622511c
          git commit -m 'Reconcile full Count-Sheep campaign with upstream fixes and runtime names' -m 'Preserve both histories, donor whole-TU HSD and linked Secret Power work, upstream helper cleanups and all 42 runtime identities. Resolve 39 conflicts, update OS initialization and six force-active names, remove 143 dormant asm placeholders, and register the evidenced SDK reset primitive. Canonical hashes, module configuration and splits unchanged. Full retail validation remains required.'
      - name: Validate source quality and checker tests
        shell: sh
        run: |
          set -eu
          python -m py_compile configure.py
          python -m unittest discover -s .github/scripts -p 'test_*.py'
          python .github/scripts/quality_scan.py 5cfe5ca3d09f20c4adc3c9b2a4e8d3c29046f10f HEAD
          python .github/scripts/check_asm_wrappers.py src
      - name: Publish only the reconciled integration branch
        shell: sh
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/integrate/count-sheep-full-20261011
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          git merge-base --is-ancestor 5cfe5ca3d09f20c4adc3c9b2a4e8d3c29046f10f HEAD
          git push origin HEAD:refs/heads/integrate/count-sheep-full-20261011
          git log -1 --format='Reconciled commit: %H%nTree: %T%nParents: %P'
          echo 'Source reconciliation published; master has not been changed. Retail build and regression validation are still required.'
