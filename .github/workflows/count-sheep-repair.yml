name: Publish validated Count-Sheep build repair
on:
  push:
    branches: [integrate/count-sheep-full-20261011]
    paths: [.github/workflows/count-sheep-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the exact source and configuration validated in run 38285680548
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --exit-code 7c31c47386243804fd7c9dd1a3c089546d155213 HEAD -- src include config tools .github/scripts configure.py
          test "$(git rev-parse HEAD:configure.py)" = 1eaf206cd185bfdd4e4a3d16cf53841f7823258e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('configure.py');s=p.read_text()
          marker='config.reconfig_deps = []'
          assert s.count(marker)==1
          addition='''config.reconfig_deps = []
          # Retail callable exports must survive even without REL consumers.
          # Do not retain arbitrary source-only helpers or force unrelated data.
          export_manifest = Path("config") / config.version / "dol_exports.txt"
          config.reconfig_deps.append(export_manifest)
          config.force_active_symbols["main"].extend(
              line.strip() for line in export_manifest.read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          )'''
          s=s.replace(marker,addition)
          start=s.index('config.custom_build_steps = {\n    "pre-split": [')
          end=s.index('\n# Base CodeWarrior flags',start)
          replacement='''# Accept validated loose RELs as an alternative to retaining entire FSYS
          # archives. An available archive stays a Ninja dependency and is authoritative.
          from tools.fsys_inputs import extraction_steps

          config.custom_build_steps = {
              "pre-split": extraction_steps(config.version, fsys_modules),
          }
          '''
          p.write_text(s[:start]+replacement+s[end:])
          PY
          test "$(git hash-object configure.py)" = 6d681031cee1619a48f5de8dc3b754a138792e93
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          git add configure.py
          test "$(git diff --cached --name-only)" = configure.py
          git diff --cached --check
          git commit -m 'Retain retail DOL exports and support validated loose REL inputs' -m 'Publish exactly configure.py blob 6d681031cee1619a48f5de8dc3b754a138792e93 tested by run 38285680548/job/114933360995: all DOL sources, canonical SHA-1, direct byte comparison, metric integrity and both module/address regression audits passed. Full 25-REL validation remains blocked on original inputs. Workflow edits are handled separately.'
          test "$GITHUB_REF" = refs/heads/integrate/count-sheep-full-20261011
          git push origin HEAD:refs/heads/integrate/count-sheep-full-20261011
          git log -1 --format='Published commit: %H%nTree: %T'
